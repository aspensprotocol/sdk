syntax = "proto3";

package xyz.aspens.arborter.v1;

option optimize_for = SPEED;

service ArborterService {
  rpc SendOrder(SendOrderRequest) returns (SendOrderResponse) {}
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse) {}
  rpc Trades(TradeRequest) returns (stream Trade) {}
  rpc Orderbook(OrderbookRequest) returns (stream OrderbookEntry) {}
  // Request a TEE-signed withdrawal voucher. The chain can no
  // longer self-judge a withdrawal under the optimistic shadow ledger, so the
  // arborter freezes the settled funds and returns an owner-signed voucher the
  // holder submits to MidribV3.withdraw(voucher, signature).
  rpc Withdraw(WithdrawRequest) returns (WithdrawResponse) {}
}

message Empty {}

/* rpc: Withdraw */
message WithdrawRequest {
  // The chain/network the funds sit on (network key, e.g. "flare-coston2").
  string network = 1;
  // Token contract address on `network`.
  string token = 2;
  // The withdrawer's wallet address on `network`. The resulting voucher pays
  // this address regardless of who submits it on-chain.
  string account = 3;
  // Amount in token base units, as a decimal string (u128).
  string amount = 4;
  // Signature by `account`'s key over the canonical request bytes
  // ("network|token|account|amount"): Secp256k1 on EVM, Ed25519 on Solana.
  bytes signature = 5;
}

message WithdrawResponse {
  // The voucher fields the holder submits to MidribV3.withdraw(...).
  string account = 1;
  string token = 2;
  string amount = 3;
  uint64 nonce = 4;
  uint64 expiry = 5;
  // The TEE (instance-owner) EIP-712 signature over the voucher.
  bytes signature = 6;
}

message CancelOrderRequest {
  OrderToCancel order = 1;
  bytes signature_hash = 2;
}

message CancelOrderResponse {
  // Whether the order was found and canceled
  bool order_canceled = 1;
  // Transaction hashes associated with this cancellation
  repeated TransactionHash transaction_hashes = 2;
  // Current state of the orderbook after this operation
  repeated OrderbookEntry current_orderbook = 3;
}

message OrderbookRequest {
  // Used to keep the client alive
  bool continue_stream = 1;
  // The market id to stream orders for
  string market_id = 2;
  // If true, returns existing open orders when stream starts, then continues streaming
  optional bool historical_open_orders = 3;
  // If this is sent too, then we filter by a specific trader
  optional string filter_by_trader = 4;
}

message TradeRequest {
    // Used to keep the client alive
    bool continue_stream = 1;
    // The market id to stream orders for
    string market_id = 2;
    // If true, returns existing closed when stream starts, then continues streaming
    optional bool historical_closed_trades = 3;
    // If this is sent too, then we filter by a specific trader
    optional string filter_by_trader = 4;
}

message SendOrderRequest {
  // The order to send
  Order order = 1;
  // Valid signature over the encoded `Order` (EIP-191 on EVM, Ed25519 on
  // Solana). This is the ONLY thing that authenticates order entry, and it now
  // covers every input the arborter needs — which is what let the sibling
  // `OrderAuthorization` message go away entirely.
  bytes signature_hash = 2;
  // NOTE: `authorization` (field 3) and its `OrderAuthorization` message were
  // removed. It ended up holding exactly two things, and both were wrong to
  // accept from a caller: `amount_in`, which set an encumbrance while sitting
  // OUTSIDE the signature, and `order_id`, which the arborter used verbatim.
  //
  // Both are now derived server-side from the signed `Order` — the budget from
  // `(side, quantity, price, quote_budget)`, the id from those plus the signer's
  // own address and `nonce`. A caller can still compute its own id with the same
  // recipe (every input is in the message it signed), and learns the short form
  // from `SendOrderResponse.order_id`; it simply cannot choose one any more.
}

message Order {
  // 'BID' or 'ASK'
  Side side = 1;
  // Order size, in BASE units at pair decimals.
  //
  // For three of the four (side, type) combinations this is what bounds the
  // order's obligation: an ASK gives base, so `quantity` IS its budget; a LIMIT
  // BID gives quote, and `quantity * price` bounds it. The fourth — a MARKET
  // BID — is bounded by `quote_budget` below instead, and its `quantity` is
  // ignored.
  string quantity = 2;
  // Optional. including is a LIMIT order. excluding is a MARKET order.
  optional string price = 3;
  // Identity the market: concat(base_chain_id "::" token_address "::" quote_chain_id "::" token_address)
  string market_id = 4;
  // User's pubkey (address) on the Base chain.
  //
  // Casing contract: this field is part of the SIGNED order, so when the
  // server echoes this message back (`SendOrderResponse.order`) it carries the
  // address BYTE-VERBATIM as submitted — an EIP-55 checksummed submission
  // comes back checksummed. That is deliberate: rewriting a field of a signed
  // message would detach the echo from the signature that authorized it.
  // Every OTHER address the server emits (`OrderbookEntry`, `Trade`) is
  // canonicalized instead (EVM lowercased, base58 byte-exact), so do not
  // string-compare this echo against those fields without lowercasing the EVM
  // case first.
  string base_account_address = 5;
  // User's pubkey (address) on the Quote chain. Echoed byte-verbatim, same as
  // `base_account_address`.
  string quote_account_address = 6;
  // 'DIRECT' (default): ordinary price-time-priority matching against the
  // book. 'DISCRETIONARY': the dealroom flow — this order names the exact
  // resting orders it is willing to fill, via `matching_order_ids` below.
  // See that field and `ExecutionType` for the full contract.
  ExecutionType execution_type = 7;
  // DISCRETIONARY only: 1..=16 resting order ids to fill against, tried in
  // the given sequence. Each is the full 32-byte canonical order id from
  // that resting order's `SendOrderResponse.order_id`, carried here as raw
  // bytes — the maker shares it as `0x`-prefixed hex with this caller
  // out-of-band for the dealroom flow; there is no other way to learn one,
  // and a hidden maker's id works the same as a visible one's.
  //
  // Fills happen ONLY against these named ids, in this order, and NEVER
  // against any other resting order — no sweep of top-of-book alongside
  // the named fills. Each fill executes at the RESTING (named) order's own
  // price, gated by this order's own limit price: a named order priced
  // worse than this order's limit is skipped, not filled at this order's
  // price instead of its own. That limit price is REQUIRED for a
  // DISCRETIONARY order (no market discretionary) and `quote_budget` is
  // rejected on it, exactly as for any other limit order — the spend is
  // `quantity x price`, already signed.
  //
  // Whatever quantity is left after walking the list is dropped, not
  // rested: DISCRETIONARY is immediate-or-cancel only. Naming a resting
  // order owned by this order's own signer rejects the WHOLE order (no
  // self-match, no partial fill of the rest of the list first). The list
  // must be non-empty and at most 16 ids long; empty (the default) is what
  // every DIRECT order carries.
  repeated bytes matching_order_ids = 8;
  // Post-only: if true, the order MUST rest on the book. If it would
  // cross any opposing confirmed order at submission time the request
  // is rejected with FAILED_PRECONDITION and no on-chain lock is
  // performed. Limit orders only — incompatible with market (no price)
  // and with DISCRETIONARY execution_type. Defaults to false, which
  // preserves legacy take-or-rest behavior.
  bool post_only = 9;
  // Hidden ("invisible") order: matched, settled, and canceled exactly
  // like a visible order (normal price-time priority), but never exposed
  // publicly — excluded from the Orderbook stream (live + historical),
  // from the current_orderbook embedded in Send/CancelOrderResponse,
  // and therefore from all client-derived depth. Appears in NO stream,
  // not even to its owner: track via SendOrderResponse.order_id. When a
  // hidden order fills, the trade prints publicly with the hidden side's
  // identity fields (ids + addresses) redacted to empty/zero.
  // Defaults to false (wire-skipped), so pre-feature signed envelopes
  // are byte-identical.
  bool hidden = 10;
  // The maximum QUOTE this order may spend, in the quote token's native base
  // units (NOT pair decimals) — the same denomination the ledger reserves in.
  // Decimal-string encoding of `u128`, matching `quantity` / `price`.
  //
  // One rule governs every order: **it commits a budget, denominated in the
  // asset it gives.** An ASK gives base and is bounded by `quantity`; a LIMIT
  // BID gives quote and is bounded by `quantity * price`. A MARKET BID gives
  // quote with no price to convert with, so nothing derivable bounds it — it
  // must say outright how much it is prepared to spend. That is this field, and
  // it is the order's SIZE, not a restatement of a size given elsewhere.
  //
  // REQUIRED for a market BID (no price, side BID); the arborter refuses one
  // without it, because an unbounded obligation cannot be collateralised.
  // REJECTED on every other order, where the budget is derived and a
  // caller-supplied figure could only disagree with it.
  //
  // It lives in `Order` rather than beside it precisely so `signature_hash`
  // covers it: this number authorises spending, and the retired
  // `OrderAuthorization.amount_in` was unsigned.
  optional string quote_budget = 11;
  // Caller-chosen nonce, folded into the order id so one wallet's otherwise
  // identical orders get distinct ids. Millis-since-epoch is the SDK's choice;
  // any value works, and the caller may reuse one deliberately — a repeat
  // derives the same id and is refused as a replay.
  //
  // It lives HERE, inside the signed `Order`, and that is the whole point. The
  // arborter derives the canonical order id itself from this message and stops
  // trusting a caller-supplied one, which is only possible if every input to
  // the derivation is signed. While the nonce sat outside, the id depended on a
  // value the server never saw and the signature never covered.
  //
  // What that buys, beyond tidiness: the derivation hashes the caller's own
  // address, so an order signed by an attacker cannot derive to a victim's id.
  // Pre-claiming someone else's id — refusing their order by reserving its id
  // first — stops being expressible rather than being defended against.
  uint64 nonce = 12;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BID = 1;
  SIDE_ASK = 2;
}

enum ExecutionType {
  // Default: ordinary price-time-priority matching against the book.
  // `Order.matching_order_ids` is empty for this type.
  EXECUTION_TYPE_UNSPECIFIED = 0;
  // Dealroom flow: this order carries `Order.matching_order_ids`, a
  // caller-named list of 1..=16 resting order ids (each a
  // `SendOrderResponse.order_id` the maker shared out-of-band) it is
  // willing to fill against, tried in the listed sequence. Fills happen
  // ONLY against those named ids — never against any other resting order —
  // each at the RESTING order's own price, gated by this order's own
  // (REQUIRED) limit price; `quote_budget` is rejected, same as any other
  // limit order. Unfilled remainder is dropped rather than rested
  // (immediate-or-cancel only). Naming one of the caller's own resting
  // orders rejects the whole order. See `Order.matching_order_ids` for the
  // full contract.
  EXECUTION_TYPE_DISCRETIONARY = 1;
}

// The actual state of an order in the matching engine
enum OrderState {
  ORDER_STATE_UNSPECIFIED = 0;
  // Order submitted, funds locked on-chain, shows in orderbook but NOT matchable
  ORDER_STATE_PENDING = 1;
  // OrderOpen blockchain event received, order is now matchable
  ORDER_STATE_CONFIRMED = 2;
  // Order matched by matching engine, trade recorded
  ORDER_STATE_MATCHED = 3;
  // Order canceled
  ORDER_STATE_CANCELED = 4;
  // On-chain settlement completed successfully
  ORDER_STATE_SETTLED = 5;
}

message Trade {
  // When the engine registers this executed trade
  uint64 timestamp = 1;
  // Execution price, in pair-decimal units — the resting (maker) order's own
  // price. No fee is applied here: fees are taken at settlement, not on the
  // trade print.
  string price = 2;
  // Traded quantity in BASE units at pair decimals — the same units as
  // `Order.quantity`. (This has always been what the server sends; an older
  // version of this comment claimed quote units, which was never true.) The
  // quote amount is not on the wire: derive it as `qty * price / 10^pair_decimals`
  // if needed.
  string qty = 3;
  // Maker's internal trader id. Safely ignore.
  string maker_id = 4;
  // Taker's internal trader id. Safely ignore.
  string taker_id = 5;
  // The maker's base chain wallet address.
  //
  // All four wallet addresses on this message are CANONICALIZED by the server:
  // EVM addresses arrive as lowercase hex regardless of how the trader
  // submitted them (an EIP-55 checksummed submission is lowercased), and
  // base58 (Solana) addresses pass through byte-exact, case significant. The
  // same rule covers `OrderbookEntry`'s maker addresses. The ONE exception on
  // the wire is `Order.base_account_address` / `Order.quote_account_address`
  // in a placement response, which echo the signed submission byte-verbatim —
  // see the comments there. Clients comparing any of these four fields
  // against a locally-held EVM address must lowercase their own side first.
  string maker_base_address = 6;
  // The maker's quote chain wallet address (canonicalized; see
  // `maker_base_address`)
  string maker_quote_address = 7;
  // The taker's base chain wallet address (canonicalized; see
  // `maker_base_address`)
  string taker_base_address = 8;
  // The taker's quote chain wallet address (canonicalized; see
  // `maker_base_address`)
  string taker_quote_address = 9;
  // Who is the buyer in this trade (MAKER or TAKER)
  TradeRole buyer_is = 10;
  // Who is the seller in this trade (MAKER or TAKER)
  TradeRole seller_is = 11;
  // Which order this trade matched: the full 32-byte canonical order id,
  // shown as `0x`-prefixed hex, matching that order's
  // `SendOrderResponse.order_id`. Server-derived — the order's owner never
  // chose it, only received it back.
  bytes order_hit = 12;
  // Which market this trade executed on:
  // `base_chain::base_token::quote_chain::quote_token`, the same identity
  // `TradeRequest.market_id` and `OrderbookEntry.market_id` use.
  //
  // REQUIRED for the live Trades stream to be scoped. Without it, a live
  // trade carries no market identity, so a per-market subscription can only
  // filter on the four trader-address fields — meaning a subscriber to one
  // market would receive fills from every other market as long as the
  // addresses matched. The engine's trade already carries this; it simply
  // was not on the wire, which is why the live half of `Trades` has no
  // producer today.
  //
  // Set on every `Trade`, including those embedded in `SendOrderResponse`.
  string market_id = 13;
}

enum TradeRole {
  TRADE_ROLE_UNSPECIFIED = 0;
  MAKER = 1;
  TAKER = 2;
}

/* Transaction hash information */
message TransactionHash {
  // Type of transaction hash
  string hash_type = 1;
  // The transaction hash value
  string hash_value = 2;
}

/* rpc: SendOrder */
message SendOrderResponse {
  // Whether the order has unmatched volume and has been added to the book.
  bool order_in_book = 1;
  // If the order lands in the book, what remains unfilled from the order.
  optional Order order = 2;
  // Which other orders, if any, this order was matched with.
  repeated Trade trades = 3;
  // Transaction hashes associated with this order
  repeated TransactionHash transaction_hashes = 4;
  // Current state of the orderbook after this operation
  repeated OrderbookEntry current_orderbook = 5;
  // The order's canonical identifier: the full 32-byte order id, shown as
  // `0x`-prefixed hex. Always server-derived from the signed order — the
  // caller cannot choose or influence it, only learn it from this response.
  bytes order_id = 6;
}

/* rpc: CancelOrder */
message OrderToCancel {
  // Identity the market: concat(base_chain_id "::" token_address "::" quote_chain_id "::" token_address)
  string market_id = 1;
  // 'BID' or 'ASK'
  Side side = 2;
  // the token address
  string token_address = 3;
  // The order's canonical identifier: the full 32-byte order id, shown as
  // `0x`-prefixed hex, exactly as returned in `SendOrderResponse.order_id`.
  // Server-derived at order entry — the caller only echoes it back here to
  // identify which order to cancel, never chooses it.
  bytes order_id = 4;
}

/* rpc: Orderbook */
message OrderbookEntry {
  // when the order first landed in The Orderbook
  uint64 timestamp = 1;
  // The order's canonical identifier: the full 32-byte order id, shown as
  // `0x`-prefixed hex, matching `SendOrderResponse.order_id` for the same
  // order. Server-derived; not choosable by the order's owner.
  bytes order_id = 2;
  // price of the order - in non-decimal form
  string price = 3;
  // quantity of the order - in non-decimal form
  string quantity = 4;
  // 'BID = 1' or 'ASK = 2'
  Side side = 5;
  // The maker's base chain wallet address. Canonicalized by the server —
  // EVM lowercased hex, base58 byte-exact — same rule as `Trade`'s address
  // fields; see `Trade.maker_base_address` for the full contract, including
  // the one byte-verbatim exception (`Order`'s echoed addresses).
  string maker_base_address = 6;
  // The maker's quote chain wallet address (canonicalized; see
  // `maker_base_address`)
  string maker_quote_address = 7;
  // The market ID this order belongs to
  string market_id = 8;
  // The actual state of the order (Pending, Confirmed, Matched, Canceled, Settled)
  OrderState state = 9;
  // Mirrors Order.post_only for the resting order. Lets streaming
  // clients distinguish post-only liquidity from regular limits.
  bool post_only = 10;
}
