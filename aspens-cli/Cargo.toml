[package]
name = "aspens-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "aspens-cli"
path = "src/main.rs"

[dependencies]
# Local dependencies — features declared explicitly so changes to the
# aspens crate's default features don't silently affect this binary.
# `dcap-fetch` adds the TDX attestation verifier + collateral fetcher
# (the `verify-attestation` command).
aspens = { path = "../aspens", default-features = false, features = [
  "client",
  "trader",
  "evm",
  "solana",
  "dcap-fetch",
] }
aspens-cliutil = { path = "../aspens-cliutil" }

# Workspace dependencies
alloy.workspace = true
eyre.workspace = true
clap.workspace = true
clap-verbosity.workspace = true
getrandom.workspace = true
hex.workspace = true
log.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[features]
default = ["fce"]
admin = ["aspens/admin"]

# FCE direct-action transport. Without it the CLI can only reach an arborter
# over gRPC, which is unreachable when the arborter runs inside a Confidential
# Space image — trades, withdraws and even config discovery all fail there.
#
# A local feature rather than a bare `aspens/fce` entry above, because the CLI
# has to `#[cfg]` its own direct-action branches and a `cfg(feature = ...)` in
# this crate resolves against THIS crate's features. On by default and selected
# at runtime by EXT_PROXY_URL + DIRECT_API_KEY, so it changes nothing for gRPC
# stacks; `--no-default-features` yields a pure-gRPC binary.
fce = ["aspens/fce"]
