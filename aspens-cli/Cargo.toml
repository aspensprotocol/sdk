[package]
name = "aspens-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "aspens-cli"
path = "src/main.rs"

[dependencies]
# Local dependencies — features declared explicitly so changes to the
# aspens crate's default features don't silently affect this binary.
# `dcap-fetch` adds the TDX attestation verifier + collateral fetcher
# (the `verify-attestation` command).
aspens = { path = "../aspens", default-features = false, features = [
  "client",
  "trader",
  "evm",
  "solana",
  "formatting",
  "dcap-fetch",
  # FCE direct-action transport. Without it the CLI can only reach an
  # arborter over gRPC, which is unreachable when the arborter runs inside
  # a Confidential Space image — deposits, trades and even config discovery
  # all fail. Auto-selected at runtime by EXT_PROXY_URL + DIRECT_API_KEY, so
  # enabling it changes nothing for gRPC stacks.
  "fce",
] }
aspens-cliutil = { path = "../aspens-cliutil" }

# Workspace dependencies
alloy.workspace = true
alloy-chains.workspace = true
eyre.workspace = true
clap.workspace = true
clap-verbosity.workspace = true
getrandom.workspace = true
hex.workspace = true
log.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[features]
default = []
admin = ["aspens/admin"]
