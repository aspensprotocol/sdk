[package]
name = "aspens-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP server over the Aspens SDK: an agent trades within per-market limits set in config"
publish = false

[lib]
name = "aspens_mcp"
path = "src/lib.rs"

[[bin]]
name = "aspens-mcp"
path = "src/main.rs"

[features]
# Exposes `fake::FakeVenue` outside this crate's own tests.
test-fake = []

[dependencies]
# Features declared explicitly so changes to the aspens crate's defaults
# don't silently affect this binary.
aspens = { path = "../aspens", default-features = false, features = ["client", "trader", "evm", "solana", "tron"] }

chrono.workspace = true
eyre.workspace = true
hex.workspace = true
clap.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tonic.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rmcp.workspace = true
schemars.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tempfile.workspace = true
# The rig e2e mines blocks on the anvil forks over JSON-RPC.
reqwest.workspace = true
tokio = { workspace = true, features = ["io-util", "test-util"] }

# Drives the server over an in-process MCP client against `fake::FakeVenue`.
[[test]]
name = "mcp_surface"
required-features = ["test-fake"]

# Drives the built binary over stdio against the local rig; every test is
# #[ignore] and needs RIG=1 (see the file's header).
[[test]]
name = "rig_e2e"
